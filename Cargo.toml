# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-path-edi"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-path-edi"
description = "EDI path technology: a segment, element and component of an EDIFACT or X12 interchange, read and written, for promote, demote, route and process. A xmip-core-path technology."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability (repository-model.md). The
# interchange is cut by the contract technologies' own syntax, never a
# second reader of it.
path = { package = "xmip-core-path", git = "https://github.com/IlleNilsson/xmip-core-path", branch = "main" }
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main" }
edifact = { package = "xmip-core-contract-edi-edifact", git = "https://github.com/IlleNilsson/xmip-core-contract-edi-edifact", branch = "main" }
x12 = { package = "xmip-core-contract-edi-x12", git = "https://github.com/IlleNilsson/xmip-core-contract-edi-x12", branch = "main" }
stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
xcore = { package = "xmip-core", git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[dev-dependencies]
# The Stream fixture, for the tests only (ADR-0044).
contract = { package = "xmip-core-contract", git = "https://github.com/IlleNilsson/xmip-core-contract", branch = "main", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
too_many_lines = "warn"
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[profile.dev.package."*"]
opt-level = 3
